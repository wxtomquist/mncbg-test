<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0b0c10" />
  <script src="/theme.js"></script>
  <meta name="apple-mobile-web-app-title" content="MNCBG Events" />
  <link rel="apple-touch-icon" href="/apn/icons/icon-192.png" />
  <link rel="icon" href="/apn/favicon.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/apn/app.css" />
  <title>All Pints North — Map</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/unified.css" />
</head>
<body class="festival-page event-apn">
  <!-- Appbar -->
  <div class="appbar">
    <div class="appbar-inner">
      <a class="logo-dot" href="/" aria-label="Back to Events"></a>
      <div class="app-title-wrap">
        <div class="title">All Pints North 2026</div>
        <div class="subtitle">Festival Map</div>
      </div>

      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span class="nav-toggle-bar"></span>
      </button>

      <nav class="topnav" aria-label="Primary">
        <a class="events-home-link" href="/">← Events</a>
        <a href="/apn/index.html">Information</a>
        <a href="/apn/list.html">Beer &amp; Beverage List</a>
        <a href="/apn/guide.html">Guide</a>
        <a href="/apn/map.html">Map</a>
        <a href="https://www.mncraftbrew.org/all-pints-north/" target="_blank" rel="noopener">Festival Website</a>
      </nav>
    </div>
  </div>

  <div class="page">
    <div class="card">
      <a class="cta" href="icons/apn-map-1.pdf" target="_blank" rel="noopener">
        Download Map (PDF)
      </a>

      <!-- Image Carousel -->
      <div class="viewer" id="viewer">
        <div class="stage" id="stage">
          <button class="carousel-arrow left" id="prevBtn" aria-label="Previous page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>

          <img id="slide" alt="Carousel page" style="max-width:100%;height:auto;border-radius:10px;display:block" loading="eager" />

          <button class="carousel-arrow right" id="nextBtn" aria-label="Next page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
          </button>
        </div>

        <div class="pager" id="pageInfo" aria-live="polite">Page 1 / N</div>
      </div>

    </div>
  </div>

  <!-- Unified nav toggle + active link -->
  <script>
  (function () {
    // --- NAV TOGGLE ---
    const btn = document.querySelector('.nav-toggle');
    const nav = document.querySelector('.topnav');

    if (btn && nav) {
      btn.addEventListener('click', () => {
        const open = nav.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });

      document.addEventListener('click', (e) => {
        if (!nav.contains(e.target) && !btn.contains(e.target)) {
          nav.classList.remove('open');
          btn.setAttribute('aria-expanded', 'false');
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          nav.classList.remove('open');
          btn.setAttribute('aria-expanded', 'false');
        }
      });
    }

    // --- ACTIVE LINK (robust for "/" and sub-folders) ---
    function normalizeToFile(pathname) {
      if (!pathname) return 'index.html';
      pathname = pathname.replace(/\/+$/, '');
      if (pathname === '' || pathname === '/') return 'index.html';
      const seg = pathname.split('/').pop();
      return seg || 'index.html';
    }

    const currentFile = normalizeToFile(location.pathname);

    document.querySelectorAll('.topnav a').forEach(a => a.classList.remove('active'));

    document.querySelectorAll('.topnav a[href^="/"]').forEach(a => {
      try {
        const linkPath = new URL(a.getAttribute('href'), location.origin).pathname;
        const linkFile = normalizeToFile(linkPath);
        if (linkFile === currentFile) a.classList.add('active');
      } catch {}
    });
  })();
  </script>

  <!-- Simple Image Carousel (Map) -->
  <script>
    const IMAGES = [
      '/apn/icons/apn-map-1.png'
    ];

    const imgEl    = document.getElementById('slide');
    const pageInfo = document.getElementById('pageInfo');
    const prevBtn  = document.getElementById('prevBtn');
    const nextBtn  = document.getElementById('nextBtn');
    const stage    = document.getElementById('stage');

    let idx = 0;
    const total = IMAGES.length;

    function preload(i){
      if (i < 0 || i >= total) return;
      const im = new Image();
      im.src = IMAGES[i];
    }

    function update(){
      imgEl.src = IMAGES[idx];
      imgEl.alt = `Map page ${idx+1} of ${total}`;
      pageInfo.textContent = `Page ${idx+1} / ${total}`;
      prevBtn.disabled = (idx === 0);
      nextBtn.disabled = (idx === total-1);
      preload(idx+1); preload(idx-1);
    }

    prevBtn.addEventListener('click', ()=>{ if(idx>0){ idx--; update(); }});
    nextBtn.addEventListener('click', ()=>{ if(idx<total-1){ idx++; update(); }});

    window.addEventListener('keydown', (e)=>{
      if (e.key === 'ArrowLeft') prevBtn.click();
      else if (e.key === 'ArrowRight') nextBtn.click();
    });

    (function(){
      let startX = 0, touching = false;
      stage.addEventListener('touchstart', (e)=>{ touching = true; startX = e.touches[0].clientX; }, {passive:true});
      stage.addEventListener('touchend', (e)=>{
        if (!touching) return; touching = false;
        const endX = (e.changedTouches && e.changedTouches[0]?.clientX) || startX;
        const dx = endX - startX;
        if (Math.abs(dx) > 40){
          if (dx < 0) nextBtn.click(); else prevBtn.click();
        }
      }, {passive:true});
    })();

    update();
  </script>

  <script src="/update-banner.js"></script>
</body>
</html>
