<!doctype html>
<!-- build: full-csv-update-v3-force-refresh -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MN Brewers Conference | Minnesota Craft Brewers Guild Events</title>
  <meta name="theme-color" content="#081418" />
  <script src="/theme.js"></script>
  <meta name="description" content="Conference schedule, presenters, exhibitors, and saved sessions for the MN Brewers Conference." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Libre+Franklin:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    .topbar-actions{display:flex;align-items:center;gap:.65rem;justify-content:flex-end}
  </style>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/unified.css" />
</head>
<body class="mbc-page">
  <div id="app">
    <header class="topbar">
      <div class="topbar-copy">
        <div class="brand-row">
          <a class="brand-home-link" href="/" aria-label="Back to Events"><img class="brand-mark" src="assets/logo-small.png" alt="Minnesota Craft Brewers Guild logo" /></a>
          <div>
            <h1>MN Brewers Conference</h1>
            <p class="subhead">Conference Guide</p>
          </div>
        </div>
      </div>
      <div class="topbar-actions">
        <a class="events-home-link" href="/">← Events</a>
        <button id="installBtn" class="secondary-btn hidden" type="button">Install App</button>
      </div>
    </header>

    <main class="layout">
      <nav class="tabs card" aria-label="Primary">
        <button class="tab active" data-view="schedule">Schedule</button>
        <button class="tab" data-view="presenters">Presenters</button>
        <button class="tab" data-view="exhibitors">Sponsors &amp; Exhibitors</button>
        <button class="tab" data-view="map">Map</button>
        <button class="tab" data-view="info">Info</button>
        <button class="tab" data-view="my-schedule">My Schedule</button>
        <button class="tab" data-view="raffle">Raffle</button>
        <button class="tab tab-external" data-external-link="https://form.jotform.com/260675370182155">Surveys</button>
      </nav>
      <section class="hero card">
        <div class="hero-copy">
          <p class="hero-date">April 10, 2026</p>
          <h2>Find sessions fast, save your plan, and browse the event on mobile or desktop.</h2>
<p class="social-line">
Tag us on social!
<a href="https://www.facebook.com/MinnesotaCraftBrewersGuild/" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Facebook">
<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.5 9.9v-7H8v-3h2.5V9.5c0-2.5 1.5-3.9 3.7-3.9 1.1 0 2.2.2 2.2.2v2.4H15c-1.2 0-1.5.7-1.5 1.5V12H17l-.5 3h-3v7A10 10 0 0 0 22 12z"/></svg>
</a>
<a href="https://www.instagram.com/mncraftbrewersguild" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Instagram">
<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 2C4.2 2 2 4.2 2 7v10c0 2.8 2.2 5 5 5h10c2.8 0 5-2.2 5-5V7c0-2.8-2.2-5-5-5H7zm5 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm6.5-.8a1.3 1.3 0 1 1-2.6 0 1.3 1.3 0 0 1 2.6 0zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
</a>
<span class="social-text">@mncraftbrewersguild #MNBrewersConference</span>
</p>
<div class="presented-by">
  <span class="presented-label">Presented by</span>
  <img src="assets/husch-blackwell.png" alt="Husch Blackwell" class="presented-logo">
</div>
                    
        </div>
        <div class="hero-stats">
          <div><strong id="statSessions">0</strong><span>schedule items</span></div>
          <div><strong id="statPresenters">0</strong><span>presenters</span></div>
          <div><strong id="statExhibitors">0</strong><span>exhibitors</span></div>
        </div>
      </section>

      <section class="quick-grid">
        <article class="card quick-card">
          <h3 id="atAGlanceHeading">April 10 at a glance</h3>
          <div id="todayAtAGlance" class="stack at-a-glance-scroll"></div>
        </article>
        <article class="card quick-card">
          <h3>Tracks</h3>
          <div id="trackLegend" class="legend-grid"></div>
        </article>
      </section>

      

      <section class="card controls" id="controlsBar">
        <div class="search-wrap">
          <input id="searchInput" type="search" placeholder="Search sessions, speakers, locations, tracks..." />
        </div>
        <div class="filter-wrap">
          <select id="trackFilter">
            <option value="">All tracks</option>
          </select>
          <select id="typeFilter">
            <option value="">All types</option>
          </select>
          <select id="blockFilter">
            <option value="">All blocks</option>
          </select>
        </div>
      </section>

      <section class="day-toggle-wrap" id="dayToggleWrap" aria-label="Schedule day filters"></section>

      <section id="view-schedule" class="view active"></section>
      <section id="view-presenters" class="view"></section>
      <section id="view-exhibitors" class="view"></section>
      <section id="view-map" class="view"></section>
      <section id="view-info" class="view"></section>
      <section id="view-my-schedule" class="view"></section>
      <section id="view-raffle" class="view"></section>
    </main>
  </div>

  <dialog id="detailDialog" class="detail-dialog">
    <article class="dialog-card">
      <button id="closeDialog" class="close-btn" aria-label="Close">×</button>
      <div id="dialogContent"></div>
    </article>
  </dialog>

  <script src="app.js" defer></script>
  <script src="/update-banner.js"></script>
</body>
</html>
